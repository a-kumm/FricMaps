# Tooling configuration for the FricMaps QGIS plugin.
# The plugin itself is distributed as a QGIS plugin (see metadata.txt), not as a
# PyPI package; this file only configures the development tools.

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py39"
# QGIS/PyQt APIs are resolved at runtime inside QGIS.
exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # long lines are tolerated in docstrings/tables
    "E722",  # bare excepts are used defensively around the QGIS API
]
